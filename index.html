<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chelsea's Book Log</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #1f1f1f;
            color: #fff;
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #333;
        }

        h1 {
            margin: 0;
        }

        .container {
            width: 80%;
            margin: 20px auto;
            padding: 20px;
            background-color: #1f1f1f;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        h2 {
            color: #adb0ab;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        .book-item {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            background-color: #333;
            display: flex;
            align-items: center;
        }

        .book-item img {
            width: 50px;
            height: 75px;
            margin-right: 15px;
            border-radius: 3px;
            object-fit: cover;
        }

        .placeholder {
            width: 50px;
            height: 75px;
            margin-right: 15px;
            background-color: #555;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            font-size: 20px;
        }

        .loading {
            text-align: center;
            color: #bbb;
            font-size: 16px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Chelsea's Book Log</h1>
    </header>
    <div class="container" id="book-container">
        <div id="loading-indicator" class="loading">Loading books...</div>
    </div>

    <script>
        const loadBooks = async () => {
            const loadingIndicator = document.getElementById('loading-indicator');
            const container = document.getElementById('book-container');

            try {
                // Fetch the JSON file with book data
                const response = await fetch('book_image_links.json'); 
                const books = await response.json();

                // Group books by year
                const booksByYear = books.reduce((acc, book) => {
                    if (!acc[book.year]) acc[book.year] = [];
                    acc[book.year].push(book);
                    return acc;
                }, {});

                // Remove the loading indicator once data is fetched
                loadingIndicator.style.display = 'none';

                // Generate HTML for each year and its books
                Object.keys(booksByYear).sort((a, b) => b - a).forEach(year => {
                    const yearSection = document.createElement('div');
                    yearSection.innerHTML = `
                        <h2>${year}</h2>
                        <ul>
                            ${booksByYear[year]
                                .map(book => `
                                    <li class="book-item">
                                        <img src="${book.image_link}" alt="${book.title} Cover" onerror="this.src='https://via.placeholder.com/50x75';">
                                        <div>
                                            <strong>${book.title}</strong> - ${book.author}
                                        </div>
                                    </li>
                                `).join('')}
                        </ul>
                    `;
                    container.appendChild(yearSection);
                });
            } catch (error) {
                // Handle errors and display an error message
                console.error('Error loading books:', error);
                loadingIndicator.innerHTML = 'Failed to load books. Please try again later.';
            }
        };

        // Load the books when the page is loaded
        window.onload = loadBooks;
    </script>
</body>
</html>
